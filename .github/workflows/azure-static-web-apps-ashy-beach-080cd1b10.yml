name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      # Compila antes de desplegar para que un error de TypeScript falle aquí,
      # con el error a la vista. Si se deja solo en manos de Oryx, un build roto
      # no produce `dist` y la acción termina subiendo /src entero —node_modules
      # incluido—, y el content server responde "The number of static files was
      # too large", que no dice nada del problema real.
      # Oryx vuelve a construir en el paso de deploy: esto es una red de
      # seguridad, no el build que se publica.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            api/package-lock.json
      - name: Build frontend
        working-directory: ./src
        run: |
          npm ci
          npm run build
      - name: Build API
        working-directory: ./api
        run: |
          npm ci
          npm run build

      # El despliegue se autentica con el token de la Static Web App. La
      # plantilla original traia ademas dos pasos que pedian un token OIDC y lo
      # pasaban como `github_id_token`, pero la accion ya no acepta ese input
      # -lo reporta como "Unexpected input(s)"- asi que el token no lo consumia
      # nadie: solo agregaban una dependencia de github-script y el permiso
      # id-token para nada.
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BEACH_080CD1B10 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/src" # App source code path
          api_location: "/api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # El token autentica el cierre del entorno de preview del PR.
          # `app_location` no se usa al cerrar, pero la acción lo declara
          # obligatorio, así que se repite el del despliegue.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BEACH_080CD1B10 }}
          app_location: "/src"
          action: "close"
